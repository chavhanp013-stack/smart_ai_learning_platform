<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Quiz Topic</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card Box */
.container {
    background: white;
    padding: 35px;
    width: 380px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 0.6s ease-in-out;
}

/* Title */
h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #1e293b;
}

/* Input */
input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: 0.3s;
}

input:focus {
    border-color: #1e293b;
    outline: none;
    box-shadow: 0 0 5px rgba(30,41,59,0.3);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #1e293b;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #334155;
    transform: translateY(-2px);
}

/* Back Link */
.back {
    display: block;
    text-align: center;
    margin-top: 15px;
    text-decoration: none;
    color: #475569;
    font-size: 14px;
}

.back:hover {
    color: #1e293b;
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>

<body>

<div class="container">
    <h2>➕ Add Quiz Topic</h2>

    <form method="POST">
        <label>Topic Name</label>
        <input type="text" name="topic_name" placeholder="Enter topic name..." required>

        <button type="submit">Add Topic</button>
    </form>

    <a href="/admin_dashboard" class="back">⬅ Back to Dashboard</a>
</div>

</body>
</html>
