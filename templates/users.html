<!DOCTYPE html>
<html>
<head>
<title>Users</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
}

/* Sidebar */
.sidebar {
    width: 220px;
    background: #1e293b;
    color: white;
    height: 100vh;
    padding: 20px;
}

.sidebar a {
    display: block;
    color: #cbd5f5;
    margin: 12px 0;
    text-decoration: none;
}

/* Main */
.main {
    flex: 1;
    padding: 20px;
    background: #f1f5f9;
}

/* Table Box */
.box {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #1e293b;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #f9fafb;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="/admin_dashboard">Dashboard</a>
    <a href="/analytics">Analytics</a>
    <!-- <a href="/users">Users</a> -->
    <a href="/logout">Logout</a>
</div>

<!-- Main -->
<div class="main">

    <h1>👥 Registered Users</h1>

    <div class="box">
        <h3>Total Users: {{ total_users }}</h3>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>

            <tbody>
                {% if users %}
                    {% for user in users %}
                    <tr>
                        <td>{{ user.u_name }}</td>
                        <td>{{ user.u_email }}</td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="2">No users found</td>
                    </tr>
                {% endif %}
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
