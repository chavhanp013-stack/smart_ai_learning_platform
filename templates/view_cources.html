{% extends "base.html" %}
{% block content %}

<h2>All Courses</h2>

{% for topic in topics %}
    <div>
        <h3>{{ topic.topic_name }}</h3>
        <p>{{ topic.description }}</p>
        <a href="/levels/{{ topic.topic_id }}">
            <button>Start Quiz</button>
        </a>
    </div>
    <hr>
{% endfor %}

{% endblock %}
