<!DOCTYPE html>
<html>
<head>
<title>Courses</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
}

.sidebar {
    width: 220px;
    background: #1e293b;
    color: white;
    height: 100vh;
    padding: 20px;
}

.sidebar a {
    display: block;
    color: #cbd5f5;
    margin: 12px 0;
    text-decoration: none;
}

.main {
    flex: 1;
    padding: 20px;
    background: #f1f5f9;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

input {
    padding: 8px;
    margin-right: 10px;
}

button {
    padding: 8px 12px;
    border: none;
    background: #1e293b;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.delete {
    background: red;
}

.update {
    background: green;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 10px;
    text-align: center;
}

th {
    background: #1e293b;
    color: white;
}

tr:nth-child(even) {
    background: #f9fafb;
}
</style>

</head>

<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="/admin_dashboard">Dashboard</a>
    <a href="/courses">Courses</a>
    <a href="/logout">Logout</a>
</div>

<div class="main">

    <h1>📚 Courses</h1>

    <!-- 🔍 SEARCH -->
    <div class="box">
        <form method="GET">
            <input type="text" name="search" placeholder="Search topic...">
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- ➕ ADD -->
    <div class="box">
        <form action="/add_topic" method="POST">
            <input type="text" name="topic_name" placeholder="New topic" required>
            <button type="submit">Add</button>
        </form>
    </div>
<p id="msg" style="color:red; font-weight:bold;"></p>
    <!-- 📋 TABLE -->
    <table>
        <tr>
            <th>ID</th>
            <th>Topic Name</th>
            <!-- <th>Update</th> -->
            <th>Delete</th>
        </tr>

        {% for course in courses %}
        <tr id="row_{{ course.topic_id }}">
            <td>{{ course.topic_id }}</td>

            <td>
                <form action="/update_topic/{{ course.topic_id }}" method="POST">
                    <input type="text" name="topic_name" value="{{ course.topic_name }}">
            </td>

            <!-- <td>
                    <button class="update">Update</button>
                </form>
            </td> -->

            <td>
              <button type="button"  name="delete" class="delete" onclick="deleteTopic({{ course.topic_id }})">
            </td>
        </tr>
        {% endfor %}
    </table>

</div>
<script>
function deleteTopic(id) {

    if (!confirm("Are you sure you want to delete this topic?")) {
        return;   // ✅ Cancel → do nothing, stay same page
    }

    fetch("/delete_topic/" + id, {
        method: "POST"
    })
    .then(res => res.json())
    .then(data => {
        let row = document.getElementById("row_" + id);
        if (row) row.remove();

        document.getElementById("msg").innerText = "❌ Deleted successfully!";
    });
}
</script>
</body>
</html>
