<!DOCTYPE html>
<html>
<head>
    <title>Chatbot Explanation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            text-align: center;
        }

        .container {
            width: 70%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: left;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .answer-box {
            margin-top: 20px;
            white-space: pre-line;
            font-size: 16px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .back-btn {
            background-color: #555;
        }

        .back-btn:hover {
            background-color: #333;
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>📖 {{ subtopic }}</h2>

        <div class="answer-box">
            {{ answer }}
        </div>

        <br>
        <a href="/chatbot" class="btn back-btn">⬅ Back to Topics</a>
        <a href="/student_dashboard" class="btn">🏠 Dashboard</a>
    </div>

</body>
</html>
