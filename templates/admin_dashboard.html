<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  transition: 0.3s;
}

/* DARK MODE */
.dark {
  background: #0f172a;
  color: white;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: #1e293b;
  color: white;
  height: 100vh;
  padding: 20px;
}

.sidebar a {
  display: block;
  color: #cbd5f5;
  margin: 12px 0;
  text-decoration: none;
}

.sidebar a:hover {
  color: white;
}

/* Main */
.main {
  flex: 1;
  padding: 20px;
  background: #f1f5f9;
}

.dark .main {
  background: #0f172a;
}

/* Top Bar */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Cards */
.cards {
  display: flex;
  gap: 20px;
  margin: 30px 0;
}

.card {
  background: white;
  padding: 20px;
  flex: 1;
  border-radius: 10px;
  box-shadow: 0 5px 10px rgba(0,0,0,0.1);
  font-size: 18px;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.dark .card {
  background: #1e293b;
  color: white;
}

/* Search */
.search-box {
  padding: 10px;
  width: 250px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

/* Table */
table {
  width: 100%;
  background: white;
  margin-top: 30px;
  border-radius: 10px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.dark table {
  background: #1e293b;
}

/* Buttons */
.btn {
  padding: 8px 12px;
  border: none;
  background: #3b82f6;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

/* Clock */
.clock {
  font-weight: bold;
}

/* Footer */
footer{
background: black;
color: white;
padding: 25px 20px;
text-align: center;
font-size: 14px;
margin-top: 40px;
border-top: 1px solid rgba(255,255,255,0.1);
}

.footer-content{
max-width: 900px;
margin: auto;
line-height: 1.6;
}

.footer-content span{
color: #3b82f6;
font-weight: 500;
}

.footer-links{
margin-top: 10px;
}

.footer-links a{
color: #94a3b8;
margin: 0 10px;
text-decoration: none;
transition: 0.3s;
}

.footer-links a:hover{
color: white;
}
</style>
</head>

<body id="body">

<div class="sidebar">
  <h2>Admin Panel</h2>

  <a href="{{ url_for('home') }}">Home</a>
  <a href="{{ url_for('add_topic') }}">Add Topic</a>
  <a href="{{ url_for('courses') }}">Courses</a>
  <a href="{{ url_for('analytics') }}">Analytics</a>
  <a href="{{ url_for('users') }}">Users</a>
  <a href="{{ url_for('logout') }}">Logout</a>
</div>

<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <input type="text" placeholder="Search users..." class="search-box" onkeyup="searchTable()">

    <div style="position:relative;">
      
      <!-- 🔔 Notification -->
      <span onclick="toggleNotifications()" style="cursor:pointer; font-size:20px;">
        🔔 <span id="badge" style="color:red; font-weight:bold;">0</span>
      </span>

      <!-- Notification Box -->
      <div id="notificationBox" style="
        display:none;
        position:absolute;
        right:0;
        top:30px;
        width:250px;
        background:white;
        color:black;
        border-radius:10px;
        box-shadow:0 5px 10px rgba(0,0,0,0.2);
        padding:10px;
        max-height:300px;
        overflow-y:auto;
      ">
        <p>Loading...</p>
      </div>

      <button class="btn" onclick="toggleDark()">🌙</button>
      <span class="clock" id="clock"></span>

    </div>
  </div>

  <h1>Admin Dashboard</h1>
  <p>Welcome Admin 👋</p>

  <!-- CARDS -->
  <div class="cards">
    <div class="card">Users: <span>{{ users }}</span></div>
    <div class="card">Courses: <span>{{ courses }}</span></div>
    <div class="card">Avg Score: {{ avg_score }}%</div>
  </div>

  <!-- BAR CHART -->
  <canvas id="barChart"></canvas>

  <!-- TABLE -->
  <table id="dataTable">
    <tr>
      <th>Name</th>
      <th>Course</th>
      <th>Status</th>
    </tr>
    <tr>
      <td>John</td>
      <td>Python</td>
      <td>Active</td>
    </tr>
    <tr>
      <td>Emma</td>
      <td>AI</td>
      <td>Inactive</td>
    </tr>
  </table>

</div>

<script>

// DARK MODE
function toggleDark() {
  document.getElementById("body").classList.toggle("dark");
}

// CLOCK
setInterval(() => {
  document.getElementById("clock").innerText = new Date().toLocaleTimeString();
}, 1000);

// SEARCH
function searchTable() {
  let input = document.querySelector(".search-box").value.toLowerCase();
  let rows = document.querySelectorAll("#dataTable tr");

  rows.forEach((row, index) => {
    if(index === 0) return;
    let text = row.innerText.toLowerCase();
    row.style.display = text.includes(input) ? "" : "none";
  });
}

// BAR CHART (UPDATED)
new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
        labels: ['Users', 'Courses'],
        datasets: [{
            label: 'Platform Data',
            data: [{{ users }}, {{ courses }}],
            backgroundColor: ['#3b82f6','#10b981']
        }]
    }
});

// Notifications
function toggleNotifications() {
    let box = document.getElementById("notificationBox");

    if (box.style.display === "none") {
        loadNotifications();
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

function loadNotifications() {
    fetch("/get_notifications")
    .then(res => res.json())
    .then(data => {

        let box = document.getElementById("notificationBox");
        let badge = document.getElementById("badge");

        box.innerHTML = "";

        if (data.length === 0) {
            box.innerHTML = "<p>No notifications</p>";
            badge.innerText = 0;
            return;
        }

        badge.innerText = data.length;

        data.forEach(n => {
            box.innerHTML += `
                <div style="padding:8px; border-bottom:1px solid #ddd;">
                    ${n.message}
                    <br>
                    <small style="color:gray;">${n.created_at}</small>
                </div>
            `;
        });

    });
}

setInterval(loadNotifications, 5000);

</script>

</body>
</html>
