<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#e6f3ff;
            font-family:Arial;
        }
        .box{
            background:#fff;
            padding:40px;
            width:400px;
            border-radius:10px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
            text-align:center;
        }
        input,button{
            width:100%;
            padding:12px;
            margin-top:10px;
        }
        button{
            background:#0077b6;
            color:#fff;
            border:none;
            cursor:pointer;
        }
        .success{
    color: green;
}

.error{
    color: red;
}

    </style>
</head>
<body>

<div class="box">
    <h2>Reset Password</h2>

    <form method="POST" action="{{ url_for('forgot_password') }}">
        <input type="tel" name="number" placeholder="Registered Contact Number" required>
        <input type="password" name="new_password" placeholder="New Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Reset Password</button>
    </form>

    {% if message %}
<p class="msg {{ category }}">{{ message }}</p>
{% endif %}

    <a href="{{ url_for('login') }}">Back to Login</a>
</div>

</body>
</html>
