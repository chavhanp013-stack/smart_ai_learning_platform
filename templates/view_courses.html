{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center; margin-top:40px;">All Courses</h2>

<style>
.courses-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    margin-top:40px;
}

.course-box{
    background:white;
    color:black;
    width:230px;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 5px 10px rgba(0,0,0,0.15);
    transition:all 0.3s ease;
}

.course-box:hover{
transform:translateY(-8px);
box-shadow:
0 0 10px #4285f4,
0 0 20px #34a853,
0 0 30px #e53935;
}
.course-box h3{
    margin-bottom:10px;
}

.course-box p{
    font-size:14px;
    margin-bottom:15px;
}

.start-btn{
    padding:8px 18px;
    border:none;
    background:#1d8cf8;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.start-btn:hover{
    background:#0b6bdc;
}
.back-btn {
    position: absolute;
    top: 70px;
    right: 30px;
    padding: 10px 15px;
    background-color: blue;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.back-btn:hover {
    background-color: #45a049;
}
</style>
<a href="/student_dashboard" class="back-btn">⬅ Back to Dashboard</a>

<div class="courses-container">

{% for topic in topics %}

<div class="course-box">

<h3>{{ topic.topic_name }}</h3>
<p>{{ topic.description }}</p>

<a href="/levels/{{ topic.topic_id }}">
<button class="start-btn">Start Quiz</button>
</a>

</div>

{% endfor %}

</div>
{% endblock %}
