{% extends "base.html" %}
{% block content %}

<style>
body {
    background: #0f172a;
    font-family: 'Segoe UI', sans-serif;
}

/* Chat container */
.chat-container {
    width: 60%;
    margin: 30px auto;
    background: #1e293b;
    padding: 20px;
    border-radius: 16px;
    height: 500px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);

    /* ✅ Smooth scroll */
    scroll-behavior: smooth;
}

/* Messages */
.message {
    max-width: 70%;
    padding: 12px 16px;
    margin: 8px 0;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    animation: fadeIn 0.3s ease-in-out;
}

/* Bot message */
.bot {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;
    align-self: flex-start;
    border-bottom-left-radius: 5px;
}

/* User message */
.user {
    background: #e2e8f0;
    color: black;
    align-self: flex-end;
    border-bottom-right-radius: 5px;
}

/* Input */
.chat-input {
    width: 60%;
    margin: 15px auto;
    display: flex;
    gap: 10px;
    background: #1e293b;
    padding: 12px;
    border-radius: 14px;
    align-items: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.chat-input input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 15px;
}

/* Buttons */
.chat-input button {
    border: none;
    border-radius: 50%;
    padding: 12px;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    transition: 0.3s;
}

.chat-input button:hover {
    background: #2563eb;
}

/* Send button */
.send-btn {
    border-radius: 10px !important;
    padding: 12px 16px !important;
    background: #22c55e !important;
}

/* Typing animation */
.typing {
    display: flex;
    gap: 5px;
    align-items: center;
}

.dot {
    height: 8px;
    width: 8px;
    background: white;
    border-radius: 50%;
    animation: blink 1.4s infinite;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
    0% {opacity: 0.2;}
    20% {opacity: 1;}
    100% {opacity: 0.2;}
}

/* Fade animation */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Scrollbar */
.chat-container::-webkit-scrollbar {
    width: 6px;
}
.chat-container::-webkit-scrollbar-thumb {
    background: #3b82f6;
    border-radius: 10px;
}
</style>

<h2 style="text-align:center; color:white;">🤖 AI Tutor - {{ topic_name }}</h2>

<div class="chat-container" id="chatBox">

    {% for msg in chat_history %}
        {% if msg.role == 'user' %}
            <div class="message user">{{ msg.content }}</div>
        {% else %}
            <div class="message bot">{{ msg.content | safe }}</div>
        {% endif %}
    {% endfor %}

</div>

<form method="POST" onsubmit="showTyping()">
    <div class="chat-input">

        <input type="text" name="message" id="msgInput" placeholder="Ask something..." required>

        <button type="button" onclick="startVoice()">🎤</button>

        <button type="submit" class="send-btn">➤</button>

    </div>
</form>

<script>
let chatBox = document.getElementById("chatBox");

// ✅ Check if near bottom
function isNearBottom() {
    return chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 50;
}

// ✅ Smart scroll
function scrollToBottom(force = false) {
    if (force || isNearBottom()) {
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

// ✅ On page load
window.onload = function () {
    scrollToBottom(true);
};

// ✅ Typing animation
function showTyping() {
    let typingDiv = document.createElement("div");
    typingDiv.className = "message bot";
    typingDiv.id = "typing";

    typingDiv.innerHTML = `
        <div class="typing">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    `;

    chatBox.appendChild(typingDiv);
    scrollToBottom();
}

// ✅ Remove typing after reload
window.addEventListener("load", function () {
    let typing = document.getElementById("typing");
    if (typing) typing.remove();
});

// ✅ Voice input
function startVoice() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Voice not supported");
        return;
    }

    let recognition = new webkitSpeechRecognition();
    recognition.lang = "en-IN";
    recognition.start();

    let input = document.getElementById("msgInput");

    recognition.onstart = () => input.placeholder = "Listening...";
    recognition.onresult = (e) => input.value = e.results[0][0].transcript;
    recognition.onend = () => input.placeholder = "Ask something...";
}
</script>

{% endblock %}
