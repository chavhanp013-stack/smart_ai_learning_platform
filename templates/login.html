<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart AI Learning Platform - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
min-height:100vh;
display:flex;
flex-direction:column;
}

/* NAVBAR */
.navbar{
background:#2f3e4e;
color:white;
padding:15px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.nav-links a{
color:white;
margin-left:20px;
text-decoration:none;
}

/* CENTER FORM */
.container{
display:flex;
justify-content:center;
align-items:center;
flex:1;
}

/* FORM BOX */
.form-box{
background:white;
width:420px;
padding:40px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.1);
text-align:center;
}

.form-box h2{
color:#3b82f6;
margin-bottom:10px;
}

.form-box p{
color:#6b7280;
font-size:14px;
margin-bottom:25px;
}

.input-group{
text-align:left;
margin-bottom:18px;
}

.input-group label{
font-size:14px;
display:block;
margin-bottom:5px;
}

.input-group input{
width:100%;
padding:10px;
border:1px solid #d1d5db;
border-radius:6px;
}

/* PASSWORD */
.password-wrapper{
position:relative;
}

.password-wrapper input{
padding-right:40px;
}

.eye-btn{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#6b7280;
}

.eye-btn:hover{
color:#3b82f6;
}

/* BUTTON */
button{
width:100%;
padding:12px;
background:#3b82f6;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#2563eb;
}

/* LINKS */
.login-text{
margin-top:15px;
font-size:14px;
}

.login-text a{
color:#3b82f6;
text-decoration:none;
}

.login-text a:hover{
text-decoration:underline;
}

/* FOOTER */
footer{
background: linear-gradient(135deg,#1e293b,#0f172a);
color: #cbd5e1;
padding: 20px;
text-align: center;
font-size: 14px;
margin-top:auto;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">Smart Ai Learning</div>
<div class="nav-links">
<a href="/login">Login</a>
<a href="/signup">Sign Up</a>
</div>
</div>

<div class="container">

<div class="form-box">

<h2>Welcome Back</h2>
<p>Login to continue your AI learning journey</p>

<form method="POST">

<div class="input-group">
<label>Email</label>
<input type="email" name="email" placeholder="Enter Email" required>
</div>

<div class="input-group">
<label>Password</label>

<div class="password-wrapper">
<input type="password" name="password" id="password" placeholder="Enter Password" required>
<i class="fa-solid fa-eye eye-btn" onclick="togglePassword()"></i>
</div>

</div>

<button type="submit">Login</button>

</form>

<div class="login-text">
<p><a href="forgot_password">Forgot Password?</a></p>
<p>New Student? <a href="/signup">Create Account</a></p>
</div>

</div>

</div>

<footer>
<p>© 2026 Unitest. All rights reserved. AI-Powered Learning Platform</p>
</footer>

<script>
function togglePassword() {
    let passwordInput = document.getElementById("password");
    let eye = document.querySelector(".eye-btn");

    if (passwordInput.type === "password") {
    passwordInput.type = "text";
    eye.classList.add("fa-eye");       // visible
    eye.classList.remove("fa-eye-slash");
} else {
    passwordInput.type = "password";
    eye.classList.add("fa-eye-slash"); // hidden
    eye.classList.remove("fa-eye");
}
}
</script>

</body>
</html>
