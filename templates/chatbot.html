{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
<div class="card shadow p-4">

<h2>AI Learning Chatbot</h2>

<form method="POST">
    <textarea name="message" rows="4" cols="50" placeholder="Ask your question..."></textarea><br>
    <button type="submit">Ask</button>
</form>

{% if response %}
    <h3>AI Response:</h3>
    <p>{{ response }}</p>
{% endif %}

</div>
</div>

{% endblock %}
