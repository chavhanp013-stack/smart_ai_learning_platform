{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center; margin-bottom:30px;">📊 Course Performance Analytics</h2>
<style>
    .start-btn:hover{
    background:#0b6bdc;
}
.back-btn {
    position: absolute;
    top: 70px;
    right: 30px;
    padding: 10px 15px;
    background-color: blue;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.back-btn:hover {
    background-color: #45a049;
}
</style>

<!-- BAR CHART -->
<div class="chart-container">
    <div class="chart-card">
        <canvas id="barChart"></canvas>
    </div>
</div>

<!-- PIE CHART -->
<div class="chart-container" style="margin-top:50px;">
    <div class="chart-card">
        <canvas id="pieChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const labels = {{ subjects | map(attribute='name') | list | tojson }};
const scores = {{ subjects | map(attribute='score') | list | tojson }};

// ================= BAR CHART =================
const barCtx = document.getElementById('barChart').getContext('2d');
const gradient = barCtx.createLinearGradient(0,0,0,400);
gradient.addColorStop(0,"#4facfe");
gradient.addColorStop(1,"#00f2fe");

new Chart(barCtx, {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Completion %',
            data: scores,
            backgroundColor: gradient,
            borderRadius:10,
            borderSkipped:false
        }]
    },
    options: {
        responsive:true,
        animation:{
            duration:1500,
            easing:'easeOutBounce'
        },
        plugins:{
            legend:{ display:false },
            tooltip:{ backgroundColor:"#333", titleColor:"#fff", bodyColor:"#fff" },
            title:{
                display:true,
                text:"Student Learning Progress by Topic (Bar Chart)",
                font:{ size:18 }
            }
        },
        scales:{
            y:{
                beginAtZero:true,
                max:100,
                ticks:{
                    callback:function(value){ return value + "%"; }
                }
            }
        }
    }
});

// ================= PIE CHART =================
const pieCtx = document.getElementById('pieChart').getContext('2d');
const backgroundColors = ['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF','#FF9F40'];

new Chart(pieCtx, {
    type: 'pie',
    data: {
        labels: labels,
        datasets: [{
            label: 'Completion %',
            data: scores,
            backgroundColor: backgroundColors,
            borderColor: '#fff',
            borderWidth: 2
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { position: 'right', labels: { font:{ size:14 } } },
            title:{
                display:true,
                text:'Student Learning Progress by Topic (Pie Chart)',
                font:{ size:18 }
            },
            tooltip:{
                callbacks:{
                    label:function(context){
                        const total = context.chart._metasets[context.datasetIndex].total;
                        const value = context.parsed;
                        const percentage = ((value/total)*100).toFixed(1);
                        return `${context.label}: ${value} (${percentage}%)`;
                    }
                }
            }
        }
    }
});
</script>
<a href="/student_dashboard" class="back-btn">⬅ Back to Dashboard</a>
{% endblock %}
