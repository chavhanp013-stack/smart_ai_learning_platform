<!DOCTYPE html>
<html>
<head>

<title>Smart AI Learning Platform</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#1e3c72,#2a5298);
min-height:100vh;
color:black;
}
.dashboard{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
margin-top:40px;
}



/* SIDEBAR */

.navbar{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding:15px 40px;
    background:#0f172a;
    flex-wrap:wrap;
    position: fixed;   /* <-- fixed at top */
    top: 0;            /* <-- top of page */
    width: 100%;       /* <-- full width */
    z-index: 1000;     /* <-- above content */
}

.navbar h2{
    color:#fff;
}

.navbar a{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    margin:0 8px;
    border-radius:8px;
    background:#1e293b;
    transition:0.3s;
}

.navbar a:hover{
    background:#2563eb;
}

.navbar a.logout{
    background:#ef4444;
}
/* MAIN */

.main{
flex:1;
padding:120px 40px 40px 40px;
text-align:center;
}

/* TITLE */

h1{
margin-bottom:10px;
color: white;
}

.subtitle{
margin-bottom:40px;
opacity:0.9;
color: white;
}

/* FEATURE BOXES */

.dashboard{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
}

/* CARD */

.card h2,
.card h3,
.card p{
color:#000;
}

.card textarea{
color:#000;
}

.card{
background:white;
color:black;   /* add this line */
width:260px;
padding:25px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
transition:0.3s;
}
.card:hover{
transform:translateY(-10px);
box-shadow:0 15px 35px rgba(0,0,0,0.35);
}

/* BUTTON */

.card button{
margin-top:15px;
padding:10px 18px;
border:none;
background:#1d8cf8;
color:white;
border-radius:8px;
cursor:pointer;
}

.card button:hover{
background:#0b6bdc;
transform:scale(1.05);
}

/* QUIZ CARD */

.quiz-card{
margin-top:30px;
background:white;
color:black;
padding:30px;
border-radius:15px;
width:500px;
margin:auto;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* RADIO */

input[type="radio"]{
margin-right:8px;
}

.menu-container{
    position: relative;
}

.menu-icon{
    font-size:28px;
    cursor:pointer;
    background:#1e293b;
    padding:10px 15px;
    border-radius:8px;
}

.navbar{
    display:flex;
    align-items:center;
    padding:15px 40px;
    background:#0f172a;
    flex-wrap:wrap;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
}

.menu-container{
    position: relative;
    margin-right: 20px; /* space between icon and title */
}

.menu-icon{
    font-size:28px;
    cursor:pointer;
    background:white;
    padding:2px 10px;
    border-radius:8px;
}

.dropdown{
    display:none;
    position:absolute;
    top:50px; 
    left:0;
    width:220px;   /* increase dropdown width */
    background:#0f172a;
    border-radius:8px;
    padding:10px 0;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    z-index:1001;
}
.dropdown a{
    display:block;
    padding:10px 20px;
    color:white;
    text-decoration:none;
}

.dropdown a:hover{
    background:#2563eb;
}

.question{
font-size:18px;
margin-bottom:20px;
text-align:left;
}

.options{
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:20px;
text-align:left;
}

.options label{
background:#f5f5f5;
padding:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.options label:hover{
background:#e3f2fd;
}

.quiz-buttons{
display:flex;
justify-content:center;
gap:15px;
margin-top:20px;
}

.quiz-btn{
padding:10px 22px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

.quiz-btn:hover{
background:#1d4ed8;
transform:translateY(-3px);
box-shadow:0 6px 15px rgba(0,0,0,0.3);
}

.quiz-footer{
display:flex;
justify-content:flex-end;
margin-top:20px;
}

.score{
font-weight:bold;
color:#111;
}
.chat-container{
display:flex;
justify-content:center;
margin-top:40px;
}

.chat-card{
background:white;
color:black;
width:600px;
padding:25px;
border-radius:12px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
transition:0.3s;
}

.chat-card:hover{
transform:translateY(-5px);
box-shadow:0 15px 30px rgba(0,0,0,0.35);
}

.chat-card h2{
text-align:center;
margin-bottom:20px;
}

.chat-card textarea{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:10px;
margin-bottom:15px;
font-size:15px;
}

.chat-card button{
padding:10px 20px;
border:none;
background:#1d8cf8;
color:white;
border-radius:6px;
cursor:pointer;
}

.chat-card button:hover{
background:#0b6bdc;
transform:scale(1.05);
}

.response-box{
margin-top:20px;
padding:15px;
background:#f1f5f9;
border-radius:8px;
border-left:4px solid #1d8cf8;
}

.topic-container{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin-top:30px;
}

.topic-card{
display:flex;
align-items:center;
justify-content:center;
width:220px;
height:100px;
background:white;
color:#333;
font-size:18px;
font-weight:600;
border-radius:12px;
text-decoration:none;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
transition:all 0.3s ease;
}

.topic-card:hover{
transform:translateY(-8px);
box-shadow:
0 0 10px #4285f4,
0 0 20px #34a853,
0 0 30px #e53935;
color:#000;
}
.progress-container{
display:flex;
flex-direction:column;
gap:30px;
max-width:700px;
margin:auto;
}

.progress-card{
background:white;
color:#333;
padding:25px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
transition:0.3s;
}

.progress-card:hover{
transform:translateY(-5px);
box-shadow:0 15px 35px rgba(0,0,0,0.35);
}

.progress-bar{
background:#e5e7eb;
height:25px;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.progress-bar.small{
height:18px;
}

.progress-fill{
background:linear-gradient(90deg,#4285f4,#34a853,#e53935);
height:100%;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
font-weight:bold;
}

.subject-box{
margin-top:15px;
}

.subject-header{
display:flex;
justify-content:space-between;
font-weight:600;
margin-bottom:5px;
}

.improve-card{
border-left:6px solid #e53935;
background:#fff5f5;
}
.chart-container{
display:flex;
justify-content:center;
margin-top:40px;
}

.chart-card{
background:white;
padding:30px;
border-radius:15px;
width:700px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
transition:0.3s;
}

.chart-card:hover{
transform:translateY(-6px);
box-shadow:0 15px 35px rgba(0,0,0,0.35);
}

.back-btn {
    position: absolute;
    top: 40px;
    right: 30px;
    padding: 10px 15px;
    background-color: blue;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.back-btn:hover {
    background-color: #45a049;
}
</style>

</head>

<body>
<div class="navbar">

<!-- LEFT SIDE -->

<div style="display:flex; align-items:center; gap:15px;">

<div class="menu-container">
<span class="menu-icon" onclick="toggleDropdown()">☰</span>

<div id="dropdownMenu" class="dropdown">
<a href="/student_dashboard">dashboard</a>
<a href="/view_courses">View Courses</a>
<a href="/chatbot">Learn with Chatbot</a>
<a href="/view_courses">Start Quiz</a>
<a href="/view_results">View Results</a>
<a href="/logout" class="logout">Logout</a>
</div>

</div>

<h2>Smart AI Learning</h2>

</div>


<!-- RIGHT SIDE ICONS -->

<div style="display:flex; align-items:center; gap:15px;">

<!-- PROGRESS ICON -->

<div class="menu-container">
<span class="menu-icon" onclick="toggleProgress()">📊</span>

<div id="progressMenu" class="dropdown">
<a href="/progress">Progress Bar</a>
<a href="/bar_chart">Bar Chart</a>
</div>
</div>

<!-- ACHIEVEMENT ICON -->

<div class="menu-container">
<span class="menu-icon" onclick="toggleAchievement()">🏆</span>

<div id="achievementMenu" class="dropdown">
<a href="/achievements">Achievements</a>
<a href="/feedback">Feedback</a>
</div>
</div>

</div>

</div>

<div class="main">

{% block content %}{% endblock %}

</div>

<script>
function toggleDropdown(){
    const menu = document.getElementById("dropdownMenu");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

// Close dropdown if clicked outside
document.addEventListener('click', function(e){
    const menu = document.getElementById("dropdownMenu");
    const icon = document.querySelector(".menu-icon");
    if(!menu.contains(e.target) && !icon.contains(e.target)){
        menu.style.display = "none";
    }
});



function toggleDropdown(){
const menu = document.getElementById("dropdownMenu");
menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function toggleProgress(){
const menu = document.getElementById("progressMenu");
menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function toggleAchievement(){
const menu = document.getElementById("achievementMenu");
menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

document.addEventListener('click', function(e){

const menus = ["dropdownMenu","progressMenu","achievementMenu"];

menus.forEach(function(id){
const menu = document.getElementById(id);
if(menu && !menu.contains(e.target) && !e.target.classList.contains("menu-icon")){
menu.style.display="none";
}
});

});

</script>

</body>
</html>
